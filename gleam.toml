name = "symphony"
version = "0.1.0"
description = "A Gleam implementation of the OpenAI Symphony service specification"
licences = ["Apache-2.0"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
argv = ">= 1.1.0 and < 2.0.0"
handles = ">= 5.0.0 and < 6.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
yamerl = ">= 0.10.0 and < 1.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

